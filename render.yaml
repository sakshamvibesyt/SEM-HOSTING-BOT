# Render blueprint for GX Bot Hosting.
#
# IMPORTANT: this app keeps its running-process table in memory and spawns
# child processes with subprocess.Popen, so it MUST run as a single process.
# Scaling to more than one instance (or more than one gunicorn worker) will
# split the bot registry: half the requests would not see a bot the other half
# started. Keep numInstances at 1, or move process supervision out of the web
# tier first.

services:
  - type: web
    name: gx-bot-hosting
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /ping
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: data
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MONITOR_INTERVAL
        value: "3"
      - key: COOKIE_SECURE
        value: "1"
    disk:
      name: gx-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
