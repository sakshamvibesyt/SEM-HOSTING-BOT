# Render blueprint for GX Bot Hosting.
#
# IMPORTANT: this app keeps its running-process table in memory and spawns
# child processes with subprocess.Popen, so it MUST run as a single process.
# Scaling to more than one instance (or more than one gunicorn worker) will
# split the bot registry: half the requests would not see a bot the other half
# started. Keep numInstances at 1, or move process supervision out of the web
# tier first.

services:
  - type: web
    name: gx-bot-hosting
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /ping
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: data
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: MONITOR_INTERVAL
        value: "3"
      - key: COOKIE_SECURE
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: gx_hosting
      - key: BACKUP_INTERVAL_SECONDS
        value: "300"
      - key: BACKUP_KEEP_COUNT
        value: "24"
      - key: PANEL_NAME
        value: "『 𝐃𝐑Λ𝐌Λ 』 𝐇𝐎𝐒𝐓𝐈𝐍𝐆"
      - key: SUPPORT_URL
        value: "https://t.me/drama_404x"
      - key: PANEL_URL
        value: "https://sem-hosting-bot.onrender.com/"
      - key: WELCOME_VIDEO_URL
        sync: false
      - key: UPDATES_URL
        sync: false
      - key: OWNER_USERNAME
        value: "drama_404x"
      - key: OWNER_ID
        value: "9282845729"
    disk:
      name: gx-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
